# Split-horizon DNS for on-LAN (no-VPN) access to the homelab.
#
# When a device is on the home network and uses the Pi as its DNS server, our
# own domains resolve to the Pi's LAN IP (so traffic stays local, no Tailscale
# needed). Everything else is forwarded upstream. Off-LAN devices keep using
# public DNS, which points these names at the Tailscale IP instead.
#
# Bind only to the LAN IP (and loopback) so we never collide with Tailscale's
# MagicDNS resolver on 100.100.100.100:53.
listen-address=192.168.1.99
listen-address=127.0.0.1
bind-interfaces

# Don't use the host's (Tailscale-managed) resolv.conf; forward upstream
# explicitly to the router, with a public fallback.
no-resolv
server=192.168.1.1
server=1.1.1.1

# Wildcard: these domains and ALL their subdomains -> the Pi's LAN IP.
address=/elijahblaisdell.dev/192.168.1.99
address=/elijahblaisdell.com/192.168.1.99

cache-size=1000
